name: QuizForge media isolation

on:
  pull_request:
    paths:
      - "scripts/quizpack-media-preflight/**"
      - "src/features/quizpack/v1/**"
      - "src/features/quizpack/server/**"
      - "src/lib/build/media-deployment.ts"
      - "src/lib/assessment-contract/primitives.ts"
      - "src/lib/assessment-contract/scoring-v1.ts"
      - "src/lib/json/canonical.ts"
      - "src/features/quizpack/content/reference-graph.ts"
      - "src/features/quizpack/package/**"
      - "tsconfig.json"
      - "package.json"
      - "scripts/quizpack-media-build.ts"
      - "scripts/quizpack-media-next-fixture.ts"
      - "next.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/media-isolation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.20.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build fixed Next media fixture
        run: |
          pnpm --silent media:fixture prepare
          pnpm --silent media:fixture build
          pnpm --silent media:fixture verify
      - name: Prepare fixed Linux runtime
        run: pnpm --silent media:setup:linux --runtime-target=fixture
      - name: Real target matrix and offline seal
        shell: bash
        run: pnpm --silent media:provision --runtime-target=fixture
      - name: Bounded matrix failure diagnostics
        if: failure()
        shell: bash
        run: |
          TSX_TSCONFIG_PATH=./tsconfig.json node --conditions=react-server --import tsx --input-type=module <<'NODE'
          import { constants } from "node:fs";
          import { readdir, lstat, open } from "node:fs/promises";
          import { join } from "node:path";
          import { MATRIX_CASES } from "./scripts/quizpack-media-preflight/shared/runtime.ts";
          const root = ".cache/quizpack-media-preflight/linux";
          const allowed = new Set([...MATRIX_CASES["linux-smoke"], ...MATRIX_CASES["linux-lifecycle"], "crashed-parent-close-budget"]);
          const codes = new Set(["CANCELLED", "DEADLINE_EXCEEDED", "INPUT_LIMIT", "ISOLATION_UNAVAILABLE", "WORKER_FAILED", "STOP_UNCONFIRMED", "BUSY", "OUTPUT_LIMIT", "INVALID_OUTPUT"]);
          const stopped = new Set(["confirmed", "not-started", "unknown"]);
          let reports = 0;
          const directories = await readdir(root, { withFileTypes: true }).catch(() => []);
          for (const entry of directories.filter((e) => e.isDirectory() && /^[a-f0-9-]{36}$/.test(e.name)).slice(0, 8)) {
            for (const suffix of ["", "lifecycle"]) {
              let file;
              try {
                const parent = join(root, entry.name, suffix);
                if (!(await lstat(parent)).isDirectory()) continue;
                file = await open(join(parent, "summary.json"), constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
                const stat = await file.stat();
                if (!stat.isFile() || stat.size > 524288) continue;
                const bytes = Buffer.alloc(524289);
                const { bytesRead } = await file.read(bytes, 0, bytes.length, 0);
                if (bytesRead !== stat.size) continue;
                const value = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes.subarray(0, bytesRead)));
                if (!["qf-linux-preflight.v1", "qf-linux-lifecycle.v1"].includes(value.schema) || !Array.isArray(value.cases)) continue;
                const cases = value.cases.slice(0, 64).filter((c) => c && allowed.has(c.id)).map((c) => ({
                  id: c.id,
                  passed: c.passed === true,
                  code: codes.has(c.result?.code) ? c.result.code : null,
                  stopped: stopped.has(c.result?.stopped) ? c.result.stopped : null,
                }));
                console.log(JSON.stringify({ diagnostic: "matrix-cases.v1", schema: value.schema, cases }));
                reports++;
              } catch {
                // Missing/partial private reports are not permission to emit raw data.
              } finally {
                await file?.close();
              }
            }
          }
          console.log(JSON.stringify({ diagnostic: "matrix-report-count.v1", reports }));
          NODE
      - name: Verify actual sealed Next public entry
        run: pnpm --silent media:fixture verify-sealed
