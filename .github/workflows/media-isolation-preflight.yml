name: QuizForge media isolation

on:
  pull_request:
    paths:
      - "scripts/quizpack-media-preflight/**"
      - "src/features/quizpack/v1/**"
      - "src/features/quizpack/server/**"
      - "src/lib/build/media-deployment.ts"
      - "scripts/quizpack-media-build.ts"
      - "scripts/quizpack-media-next-fixture.ts"
      - "next.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/media-isolation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.20.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Build fixed Next media fixture
        run: |
          node --conditions=react-server --import tsx scripts/quizpack-media-next-fixture.ts prepare
          node --conditions=react-server --import tsx scripts/quizpack-media-next-fixture.ts build
          node --conditions=react-server --import tsx scripts/quizpack-media-next-fixture.ts verify
      - name: Prepare fixed Linux runtime
        run: node --conditions=react-server --import tsx scripts/quizpack-media-preflight/linux/setup.mjs --runtime-target=fixture
      - name: Real target matrix and offline seal
        shell: bash
        run: node --conditions=react-server --import tsx scripts/quizpack-media-preflight/shared/provision-cli.ts --runtime-target=fixture
      - name: Verify actual sealed Next public entry
        run: node --conditions=react-server --import tsx scripts/quizpack-media-next-fixture.ts verify-sealed
