name: QuizForge checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Disposable bootstrap identity, scoped to this loopback-only CI service.
          # App and migration identities are generated randomly by the bootstrap.
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-p2a-service-only
        ports:
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      QUIZFORGE_P2A_CI_HOST: 127.0.0.1
      QUIZFORGE_P2A_CI_PORT: ${{ job.services.postgres.ports[5432] }}
      QUIZFORGE_P2A_CI_USER: postgres
      QUIZFORGE_P2A_CI_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-p2a-service-only
      QUIZFORGE_P2A_CI_DATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Initialize isolated CI database and migrations
        run: pnpm --silent p2a:db:ci
      - name: Real PostgreSQL integration tests
        run: pnpm test:db
