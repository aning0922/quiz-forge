name: QuizForge checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Recovery artifact and tooling boundaries
        run: pnpm test:recovery:tools
      - name: Recovery process ordering boundaries
        run: pnpm exec vitest run --config vitest.recovery-data.config.ts tests/recovery-data/process-order.test.ts
      - name: Finite host FD diagnostics
        run: |
          failed=0
          node scripts/quizpack-media-preflight/shared/fd-host-control.mjs || failed=1
          node --import tsx scripts/quizpack-media-preflight/shared/fd-host-control.mjs || failed=1
          node --test scripts/quizpack-media-preflight/shared/fd-host-control.mjs || failed=1
          node --import tsx --test scripts/quizpack-media-preflight/shared/fd-host-control.mjs || failed=1
          node scripts/quizpack-media-preflight/shared/fd-host-control.mjs --async-probe || failed=1
          node --import tsx scripts/quizpack-media-preflight/shared/fd-host-control.mjs --async-probe || failed=1
          exit "$failed"
      - name: Media preflight contracts and local controls
        run: node --conditions=react-server --import tsx --test scripts/quizpack-media-preflight/shared/*.test.ts scripts/quizpack-media-preflight/linux/*.test.mjs scripts/quizpack-media-preflight/macos/policy.test.ts scripts/quizpack-media-preflight/macos/report.test.ts
      - name: Production build
        run: pnpm build

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Real PostgreSQL migrations and integration tests
        shell: bash
        run: bash scripts/ci-p2a-service.sh
      - name: Validation service with a separate fresh database
        shell: bash
        run: bash scripts/ci-p2a-service.sh validation
      - name: Consumer namespace with a separate fresh database
        shell: bash
        run: bash scripts/ci-p2a-service.sh namespace
      - name: Media uncertainty with a separate fresh database
        shell: bash
        run: bash scripts/ci-p2a-service.sh media-unknown
      - name: Consumer faults with a separate fresh database
        shell: bash
        run: bash scripts/ci-p2a-service.sh consumer-faults
      - name: Account authorization with a separate fresh database
        shell: bash
        run: bash scripts/ci-p2a-service.sh accounts
      - name: Account recovery windows with a separate fresh database
        shell: bash
        run: bash scripts/ci-p2a-service.sh accounts-retention
